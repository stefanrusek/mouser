name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  gate:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            lane: windows
            packages: mouser-proto,mouser-platform,mouser-testkit,mouser-core,mouser-platform-windows,mouser-app,mouser-cli,mouser-service-win,xtask
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Ubuntu system packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev libxdo-dev libssl-dev libdbus-1-dev xvfb dbus-daemon
      - name: Install toolchain from rust-toolchain.toml
        shell: bash
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch and bootstrap
        shell: bash
        run: cargo fetch --locked && cargo xtask bootstrap
      - name: Gate
        shell: bash
        run: cargo xtask gate --packages ${{ matrix.packages }} --lane ci-${{ matrix.lane }}
      - name: Missing lines
        if: always()
        shell: bash
        run: |
          export CARGO_LLVM_COV_TARGET_DIR=target/llvm-cov-ci-windows
          cargo llvm-cov report --text --ignore-filename-regex '(mouser-testkit|xtask|spikes|probes|/gen/|e2e|winapi_sys\.rs)' --output-path cov.txt 2>&1 | tail -5
          awk '/control.server\.rs:$/{p=1;next} /^[A-Za-z]:.*\.rs:$/{p=0} p' cov.txt | tr -d '\r' | sed -n 200,345p
          grep -n '\^0' cov.txt | head -20
      - name: Read feature directory
        id: feature
        if: always()
        shell: bash
        run: echo "dir=$(jq -r .feature_directory .specify/feature.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidence-${{ matrix.lane }}
          path: ${{ steps.feature.outputs.dir }}/evidence/
