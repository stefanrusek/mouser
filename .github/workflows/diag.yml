name: diag
on:
  push:
    branches: [ci-rule10]
jobs:
  diag:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p mouser-platform-macos --test diag_rule10 -- --nocapture
