name: diag
on:
  push:
    branches: [ci-rule10]
jobs:
  diag:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo fetch --locked && cargo xtask bootstrap
      - run: cargo llvm-cov -p mouser-platform-macos --text --output-path cov.txt || true
      - run: for i in 1 2; do cargo llvm-cov -p mouser-platform-macos --text --output-path cov$i.txt || true; done
      - uses: actions/upload-artifact@v4
        with:
          name: cov
          path: cov*.txt
