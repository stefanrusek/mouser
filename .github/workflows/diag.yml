name: diag
on:
  push:
    branches: [ci-rule10]
jobs:
  diag:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: for i in $(seq 1 20); do cargo test -q -p mouser-platform-macos --test contract_platform_macos_v2 || exit 1; done
