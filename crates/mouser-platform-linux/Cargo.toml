[package]
name = "mouser-platform-linux"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

# Everything here is Linux-only: on other systems the crate is an empty library so
# the workspace builds everywhere.
[target.'cfg(target_os = "linux")'.dependencies]
mouser-platform = { path = "../mouser-platform" }
ashpd = { version = "=0.13.13", default-features = false, features = ["tokio", "input_capture", "remote_desktop", "clipboard", "screencast"] }
if-addrs = { version = "=0.15.0", features = ["link-local"] }
futures-util = "=0.3.34"
reis = "=0.7.1"
rustix = { version = "=1.1.5", features = ["event", "net"] }
tokio = { version = "=1.54.0", features = ["rt-multi-thread", "sync"] }
wl-clipboard-rs = "=0.9.4"
x11rb = { version = "=0.14.0", features = ["randr", "xfixes", "xinput", "xtest"] }
zbus = { version = "=5.19.0", default-features = false, features = ["tokio"] }

[target.'cfg(target_os = "linux")'.dev-dependencies]
mouser-platform = { path = "../mouser-platform", features = ["conformance"] }
calloop = "=0.14.3"
enumflags2 = "=0.7.12"
reis = { version = "=0.7.1", features = ["calloop"] }
tempfile = "=3.27.0"
wayland-protocols = { version = "=0.32.13", features = ["server", "staging"] }
wayland-server = "=0.31.14"
tokio = { version = "=1.54.0", features = ["rt-multi-thread", "time", "sync"] }
