[package]
name = "mouser-platform-macos"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
mouser-platform = { path = "../mouser-platform" }
if-addrs = { version = "=0.15.0", features = ["link-local"] }
