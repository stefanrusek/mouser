[package]
name = "mouser-platform-macos"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
mouser-platform = { path = "../mouser-platform" }
core-foundation = "=0.10.1"
# system-configuration 0.7 is built on core-foundation 0.9; its types must match.
core-foundation-sc = { package = "core-foundation", version = "=0.9.4" }
core-graphics = { version = "=0.25.0", features = ["highsierra"] }
foreign-types = "=0.5.0"
if-addrs = { version = "=0.15.0", features = ["link-local"] }
libc = "=0.2.191"
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["NSRunningApplication", "NSWorkspace", "libc"] }
security-framework = "=3.7.0"
smappservice-rs = "=0.1.3"
system-configuration = "=0.7.0"

[dev-dependencies]
mouser-platform = { path = "../mouser-platform", features = ["conformance"] }
