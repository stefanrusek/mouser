[package]
name = "mouser-platform-macos"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
mouser-platform = { path = "../mouser-platform" }
clipboard-rs = { version = "=0.3.5", default-features = false }
core-foundation = "=0.10.1"
# system-configuration 0.7 is built on core-foundation 0.9; its types must match.
core-foundation-sc = { package = "core-foundation", version = "=0.9.4" }
core-graphics = { version = "=0.25.0", features = ["highsierra"] }
foreign-types = "=0.5.0"
if-addrs = { version = "=0.15.0", features = ["link-local"] }
libc = "=0.2.191"
block2 = "=0.6.2"
dispatch2 = { version = "=0.3.1", default-features = false, features = ["std", "objc2"] }
objc2 = "=0.6.5"
objc2-app-kit = { version = "=0.3.2", default-features = false, features = [
    "block2", "libc", "NSApplication", "NSColor", "NSDragging", "NSDraggingItem", "NSDraggingSession",
    "NSEvent", "NSFilePromiseProvider", "NSGraphics", "NSGraphicsContext", "NSPasteboard", "NSResponder",
    "NSRunningApplication", "NSScreen", "NSView", "NSWindow", "NSWorkspace",
] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = [
    "NSArray", "NSError", "NSGeometry", "NSProcessInfo", "NSString", "NSURL", "NSDate", "NSObject",
] }
security-framework = "=3.7.0"
smappservice-rs = "=0.1.3"
system-configuration = "=0.7.0"

[dev-dependencies]
mouser-platform = { path = "../mouser-platform", features = ["conformance"] }

# The file-drag test needs the real main thread running AppKit's event loop,
# which libtest's harness never does.
[[test]]
name = "contract_platform_macos_us7"
harness = false
