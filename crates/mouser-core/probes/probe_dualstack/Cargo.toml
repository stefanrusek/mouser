[package]
name = "probe_dualstack"
version = "0.0.0"
edition = "2024"
publish = false

# Standalone probe: not part of the Mouser workspace.
[workspace]

[dependencies]
quinn = "=0.11.12"
rcgen = "=0.14.10"
socket2 = "0.6"
libc = "=0.2.191"
tokio = { version = "1.54", features = ["rt-multi-thread", "net", "time", "macros"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
