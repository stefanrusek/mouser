[package]
name = "mouser-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
mouser-proto = { path = "../mouser-proto" }
mouser-platform = { path = "../mouser-platform" }
tokio-util = { version = "0.7", features = ["rt"] }
tokio = { version = "1.54", features = ["rt-multi-thread", "net", "time", "sync", "macros", "io-util", "fs"] }
quinn = "=0.11.12"
rcgen = "=0.14.10"
socket2 = "0.6"
mdns-sd = "=0.21.6"
if-addrs = { version = "=0.15.0", features = ["link-local"] }
ed25519-dalek = "3"
hmac = "0.13"
sha2 = "0.11"
getrandom = "0.3"
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
postcard = { version = "1.1.3", features = ["use-std"] }
toml = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
ipnet = "2.12"

[dev-dependencies]
mouser-testkit = { path = "../mouser-testkit" }
cucumber = "=0.23.0"
jsonschema = "0.59"
tempfile = "3"

[[test]]
name = "acc_us1"
harness = false
