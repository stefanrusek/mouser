[package]
name = "mouser-service-win"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "mouser-service"
path = "src/main.rs"

[dependencies]
mouser-proto = { path = "../../crates/mouser-proto" }
mouser-core = { path = "../../crates/mouser-core" }

# Windows-only: on other systems the crate has no Windows dependencies so the
# workspace builds everywhere.
[target.'cfg(windows)'.dependencies]
mouser-platform-windows = { path = "../../crates/mouser-platform-windows" }
windows-service = "=0.8.1"
windows = { version = "=0.62.2", features = [
    "Win32_System_Services",
    "Win32_System_RemoteDesktop",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Authentication_Identity",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_Threading",
    "Win32_System_Registry",
    "Win32_System_ProcessStatus",
] }

[dev-dependencies]
cucumber = "=0.23.0"
tokio = { version = "=1.54.0", features = ["rt", "macros"] }

[[test]]
name = "acc_v2_us5_service"
harness = false
