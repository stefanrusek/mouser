[package]
name = "mouser-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
# One test binary for the contract tests so they share `tests/support` without
# per-binary dead-code (the e2e steps are their own binary).
autotests = false

[lints]
workspace = true

[[bin]]
name = "mouser"
path = "src/main.rs"

[[test]]
name = "contract_cli"
path = "tests/contract_cli.rs"

# Alone in its process: a test here may own the machine-wide service pipe.
[[test]]
name = "contract_cli_endpoint"
path = "tests/contract_cli_endpoint.rs"

[[test]]
name = "e2e_steps"
path = "tests/e2e_steps.rs"

[[test]]
name = "e2e_j1"
path = "tests/e2e_j1.rs"
harness = false
required-features = ["e2e"]

[features]
# J1 end-to-end step definitions (run only through `cargo xtask gate --e2e j1`).
e2e = ["dep:cucumber"]

[dependencies]
mouser-core = { path = "../../crates/mouser-core" }
mouser-proto = { path = "../../crates/mouser-proto" }
mouser-platform = { path = "../../crates/mouser-platform" }
clap = { version = "4", features = ["derive"] }
tokio = { version = "1.54", features = ["rt", "macros"] }
serde = "1"
serde_json = "1"
base64 = "0.22"
sha2 = "0.11"
cucumber = { version = "=0.23.0", optional = true }

[dev-dependencies]
mouser-testkit = { path = "../../crates/mouser-testkit" }
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "time", "process", "io-util", "net"] }
tempfile = "3"
jsonschema = "0.59"
ed25519-dalek = "3"
blake2 = "0.11"

