[package]
name = "mouser-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "mouser"
path = "src/main.rs"

[features]
# J1 end-to-end step definitions (run only through `cargo xtask gate --e2e j1`).
e2e = ["dep:cucumber"]

[dependencies]
mouser-core = { path = "../../crates/mouser-core" }
mouser-proto = { path = "../../crates/mouser-proto" }
clap = { version = "4", features = ["derive"] }
tokio = { version = "1.54", features = ["rt", "macros"] }
serde = "1"
serde_json = "1"
cucumber = { version = "=0.23.0", optional = true }

[dev-dependencies]
mouser-testkit = { path = "../../crates/mouser-testkit" }
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "time", "process", "io-util"] }
tempfile = "3"
