[package]
name = "mouser-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# The live app shell (real tray, real plugins, real event loop). Off for the
# gate: that code runs only inside a launched app and cannot be unit tested.
gui = ["dep:tauri-plugin-updater", "dep:tauri-plugin-single-instance", "dep:tauri-plugin-notification", "dep:tauri-plugin-global-shortcut", "dep:gethostname"]

[dependencies]
mouser-core = { path = "../../crates/mouser-core" }
mouser-platform = { path = "../../crates/mouser-platform" }
mouser-proto = { path = "../../crates/mouser-proto" }
tauri = { version = "=2.12.5", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-updater = { version = "=2.14.0", optional = true }
tauri-plugin-single-instance = { version = "=2.5.4", optional = true }
tauri-plugin-notification = { version = "=2.7.0", optional = true }
tauri-plugin-global-shortcut = { version = "=2.4.1", optional = true }
tokio = { version = "1.54", features = ["sync", "time", "signal"] }
ed25519-dalek = "3"
base64 = "0.22"
getrandom = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
gethostname = { version = "1", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
mouser-platform-macos = { path = "../../crates/mouser-platform-macos" }

[target.'cfg(target_os = "windows")'.dependencies]
mouser-platform-windows = { path = "../../crates/mouser-platform-windows" }

[target.'cfg(target_os = "linux")'.dependencies]
mouser-platform-linux = { path = "../../crates/mouser-platform-linux" }

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dev-dependencies]
mouser-testkit = { path = "../../crates/mouser-testkit" }
tauri = { version = "=2.12.5", features = ["tray-icon", "image-png", "macos-private-api", "test"] }
tempfile = "3"
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "time"] }
cucumber = "=0.23.0"
